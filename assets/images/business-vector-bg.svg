<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Multi-stage drop shadows for 3D ribbon layers -->
    <filter id="ribbonDeepShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="16" stdDeviation="20" flood-color="#1a0003" flood-opacity="0.28" />
    </filter>
    <filter id="ribbonMediumShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="10" stdDeviation="14" flood-color="#4a0008" flood-opacity="0.22" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Red Ribbon Gradients -->
    <linearGradient id="gradRedVibrant" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ff3b47" />
      <stop offset="35%" stop-color="#e61e2b" />
      <stop offset="75%" stop-color="#be0d19" />
      <stop offset="100%" stop-color="#8a040d" />
    </linearGradient>

    <linearGradient id="gradRedBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5964" />
      <stop offset="50%" stop-color="#fa2836" />
      <stop offset="100%" stop-color="#d61120" />
    </linearGradient>

    <linearGradient id="gradRedDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#990b15" />
      <stop offset="50%" stop-color="#6e020a" />
      <stop offset="100%" stop-color="#3d0005" />
    </linearGradient>

    <linearGradient id="gradRedAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e3d" />
      <stop offset="100%" stop-color="#b50c18" />
    </linearGradient>

    <!-- Subtle White/Silver Facet Gradients -->
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5f6f9" />
      <stop offset="100%" stop-color="#e9edf2" />
    </linearGradient>

    <linearGradient id="facetGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef1f6" />
    </linearGradient>

    <!-- Halftone / Dot Matrix Pattern for corporate tech feel -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#df2531" opacity="0.18" />
    </pattern>
    <pattern id="dotPatternGrey" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#a0a8b5" opacity="0.25" />
    </pattern>
  </defs>

  <!-- 1. PURE CLEAN WHITE BACKGROUND -->
  <rect width="1920" height="1080" fill="#ffffff" />

  <!-- 2. ARCHITECTURAL GEOMETRIC FACETS (Subtle 3D papercut planes) -->
  <polygon points="0,0 950,0 1480,560 620,560" fill="url(#facetGrad1)" opacity="0.85" />
  <polygon points="620,560 1480,560 1920,1080 1100,1080" fill="url(#facetGrad2)" opacity="0.65" />
  <polygon points="0,320 820,1080 0,1080" fill="#f7f8fa" opacity="0.9" />
  <polygon points="1250,0 1920,0 1920,440 1620,240" fill="#f4f6f9" opacity="0.75" />

  <!-- Dot matrix accent field in upper center -->
  <rect x="760" y="60" width="320" height="180" fill="url(#dotPatternGrey)" />
  <rect x="180" y="780" width="260" height="200" fill="url(#dotPattern)" />

  <!-- 3. TOP-RIGHT CORNER RED WAVES -->
  <path d="M 1520,0
           C 1620,40 1760,110 1920,220
           L 1920,0 Z"
        fill="url(#gradRedDark)" opacity="0.7" />

  <path d="M 1620,0
           C 1720,30 1820,80 1920,150
           L 1920,0 Z"
        fill="url(#gradRedVibrant)" filter="url(#ribbonMediumShadow)" />

  <!-- 4. BOTTOM-RIGHT MULTI-LAYER RIBBON CURVES -->
  <path d="M 1320,1080
           C 1520,950 1720,880 1920,850
           L 1920,1080 Z"
        fill="url(#gradRedDark)" opacity="0.85" filter="url(#ribbonDeepShadow)" />

  <path d="M 1480,1080
           C 1640,970 1780,930 1920,910
           L 1920,1080 Z"
        fill="url(#gradRedVibrant)" filter="url(#ribbonMediumShadow)" />

  <path d="M 1660,1080
           C 1760,1010 1850,980 1920,970
           L 1920,1080 Z"
        fill="url(#gradRedBright)" />

  <!-- White accent separator on bottom ribbons -->
  <path d="M 1480,1080
           C 1640,970 1780,930 1920,910"
        fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9" />

  <!-- ========================================================= -->
  <!-- 5. MAIN DYNAMIC FLOWING 3D RIBBON (Across the Screen)     -->
  <!-- ========================================================= -->

  <!-- Layer A: Deep Shadow Under-Ribbon Band -->
  <path d="M 0,-40
           C 140,40 300,160 480,260
           C 780,430 1200,530 1620,580
           L 1920,620
           L 1920,740
           C 1620,700 1340,650 1100,700
           C 840,750 700,900 580,1080
           L 400,1080
           C 540,860 680,680 960,610
           C 1260,540 1560,490 1860,440
           L 1920,430
           L 1920,320
           C 1540,340 1180,270 850,170
           C 520,70 260,-10 0,-40 Z"
        fill="url(#gradRedDark)"
        filter="url(#ribbonDeepShadow)" />

  <!-- Layer B: Primary Red Dynamic Ribbon -->
  <path d="M 0,0
           C 180,50 360,180 560,290
           C 880,470 1300,540 1720,570
           L 1920,590
           L 1920,460
           C 1560,430 1200,370 880,220
           C 560,90 280,0 0,0 Z"
        fill="url(#gradRedVibrant)"
        filter="url(#ribbonMediumShadow)" />

  <!-- Layer C: Upper Bright Red Edge / Highlight -->
  <path d="M 0,0
           C 160,40 320,140 500,230
           C 800,380 1180,440 1580,470
           L 1920,480
           L 1920,460
           C 1560,430 1200,370 880,220
           C 560,90 280,0 0,0 Z"
        fill="url(#gradRedBright)"
        opacity="0.9" />

  <!-- Layer D: Crisp White 3D Ribbon Edge Strip -->
  <path d="M 0,0
           C 180,50 360,180 560,290
           C 880,470 1300,540 1720,570
           L 1920,590"
        fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />

  <!-- Layer E: Right Chevron Turn / Fold Under -->
  <path d="M 1920,460
           L 1680,560
           C 1500,610 1380,680 1290,770
           L 1420,800
           C 1520,720 1660,660 1920,620 Z"
        fill="url(#gradRedDark)"
        filter="url(#ribbonDeepShadow)" />

  <!-- Layer F: Lower Returning Arc to Bottom Edge -->
  <path d="M 1290,770
           C 1140,880 980,970 800,1080
           L 960,1080
           C 1140,970 1280,880 1420,800 Z"
        fill="url(#gradRedBright)"
        filter="url(#ribbonMediumShadow)" />

  <!-- Crisp White Edge on Lower Arc -->
  <path d="M 1290,770
           C 1140,880 980,970 800,1080"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />

  <!-- Light Sheen Glow -->
  <path d="M 0,0
           C 80,30 160,80 240,130
           C 180,90 100,45 0,0 Z"
        fill="#ffffff" opacity="0.5" />
</svg>